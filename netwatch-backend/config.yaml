server:
  port: 8080
  env: development
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

database:
  host: localhost
  port: 5432
  name: netwatch
  user: netwatch
  password: netwatch_secret
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

jwt:
  secret: "CHANGE_ME_IN_PRODUCTION"
  expiration_hours: 24
  refresh_expiration_hours: 168

snmp:
  trap_port: 162
  community: public
  timeout: 5s
  retries: 3

logging:
  level: info
  file: logs/netwatch.log
  max_size_mb: 100
  max_backups: 5
  max_age_days: 30

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "app://netwatch"

rate_limit:
  requests: 100
  window_seconds: 60
