version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netwatch}
      POSTGRES_USER: ${POSTGRES_USER:-netwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netwatch} -d ${POSTGRES_DB:-netwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  netwatch-backend:
    build:
      context: ./netwatch-backend
      dockerfile: Dockerfile
    container_name: netwatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${API_PORT:-8080}:8080"
      - "${SNMP_TRAP_PORT:-162}:162/udp"
    volumes:
      - ./netwatch-backend/config.yaml:/app/config.yaml:ro
      - backend_logs:/app/logs
    networks:
      - netwatch

  # Adminer para gerenciar o banco durante desenvolvimento
  adminer:
    image: adminer:latest
    container_name: netwatch-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    networks:
      - netwatch
    profiles:
      - dev

volumes:
  postgres_data:
  backend_logs:

networks:
  netwatch:
    driver: bridge
